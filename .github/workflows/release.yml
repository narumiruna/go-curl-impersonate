name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must match vMAJOR.MINOR.PATCH, got: $tag"
            exit 1
          fi
          git fetch --tags --force
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

  native-linux-amd64:
    needs: resolve-release
    uses: ./.github/workflows/native-build.yml
    with:
      checkout-ref: ${{ needs.resolve-release.outputs.tag }}
      module-version: ${{ needs.resolve-release.outputs.tag }}
      run-default-checks: true

  publish-release:
    permissions:
      contents: write
    needs:
      - resolve-release
      - native-linux-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: go-curl-impersonate-native-linux-amd64
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/go-curl-impersonate-native-linux-amd64.tar.gz \
              dist/go-curl-impersonate-native-linux-amd64.tar.gz.sha256 \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/go-curl-impersonate-native-linux-amd64.tar.gz \
              dist/go-curl-impersonate-native-linux-amd64.tar.gz.sha256 \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Write summary
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          {
            echo "## Release"
            echo
            echo "Published release \`$RELEASE_TAG\` with the Linux amd64 native bundle."
          } >> "$GITHUB_STEP_SUMMARY"
