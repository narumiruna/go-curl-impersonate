name: native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
      # Strict SemVer tags are built once by the release workflow.
      - "!v[0-9]+.[0-9]+.[0-9]+"
    paths:
      - ".github/workflows/native-build.yml"
      - ".github/workflows/native.yml"
      - ".gitmodules"
      - "go.mod"
      - "client/**"
      - "cmd/**"
      - "examples/**"
      - "impersonate/**"
      - "internal/**"
      - "scripts/**"
      - "third_party/curl-impersonate"
      - "README.md"
      - "docs/build.md"
      - "docs/fingerprint-verification.md"
      - "docs/native-distribution.md"
      - "docs/quickstart.md"

permissions:
  contents: read

jobs:
  native-linux-amd64:
    uses: ./.github/workflows/native-build.yml
